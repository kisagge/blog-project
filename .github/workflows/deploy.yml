name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

# Node 20 런타임 액션(도커 액션 등)을 Node 24로 강제 — 2026-06-16 디프리케이션 대응.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: pnpm format:check
      - run: pnpm test
      # 런타임(prod) 의존성의 moderate 이상 취약점 차단. dev 의존성은 배포 산출물에 없어 게이트 제외(Dependabot이 처리).
      - run: pnpm audit --prod --audit-level moderate

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # PR에선 이미지 빌드만 검증(레지스트리 푸시·배포 없음). main push에서만 GHCR 푸시.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/kisagge/blog-project:latest
            ghcr.io/kisagge/blog-project:${{ github.sha }}
          # GHA 캐시(mode=max) export가 빌드(~1.5분)보다 훨씬 오래 걸려(~11분) 제거.
          # better-sqlite3는 prebuild(컴파일 X), next build도 빠르므로 콜드 빌드가
          # ~2분대로 충분. 캐시 유지 비용이 이득보다 커 순손해였음.

  deploy:
    needs: build-and-push
    # main에 push될 때, 또는 main에서 수동 실행(workflow_dispatch)할 때 배포.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # 운영 배포는 한 번에 하나. 진행 중인 배포는 끊지 않고, 대기 중인 이전 실행은 새 실행으로 대체된다.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 연속 머지 시 빌드가 늦게 끝난 이전 커밋이 새 커밋 배포 뒤에 실행되면 구버전으로 덮어쓴다.
      # 이 커밋 이후 main에 코드 변경(=자체 Deploy가 도는 커밋)이 있으면 그 실행이 배포하므로 건너뛴다.
      # 이후 변경이 문서뿐(paths-ignore라 Deploy 미실행)이면 이 커밋을 그대로 배포.
      - name: 더 새 코드 커밋이 있으면 건너뜀
        id: guard
        if: github.event_name == 'push'
        run: |
          git fetch -q origin main
          newer=$(git diff --name-only "$GITHUB_SHA" origin/main | grep -vE '^docs/|\.md$' || true)
          if [ -n "$newer" ]; then
            echo "::notice::main에 이후 코드 변경이 있어 그 커밋의 배포에 맡기고 $GITHUB_SHA 배포를 건너뜀"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # 서버 작업은 scripts/deploy-remote.sh(커밋 이미지 pull → 배포 전 DB 백업 → 기동 → 헬스 대기).
      - uses: appleboy/ssh-action@v1
        if: steps.guard.outputs.skip != 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 20m
          script_path: scripts/deploy-remote.sh
      - name: 외부 헬스 확인(nginx 경유)
        if: steps.guard.outputs.skip != 'true'
        run: |
          for _ in 1 2 3 4 5 6; do
            curl -fsS --max-time 10 https://by-jang-blog.xyz/api/health && exit 0
            sleep 10
          done
          echo "::error::배포 후 https://by-jang-blog.xyz/api/health 응답 실패"
          exit 1
