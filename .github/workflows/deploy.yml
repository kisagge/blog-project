name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

# Node 20 런타임 액션(도커 액션 등)을 Node 24로 강제 — 2026-06-16 디프리케이션 대응.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: pnpm format:check
      - run: pnpm test
      # critical 런타임 취약점만 차단(green 유지). high/moderate는 Dependabot PR로 처리.
      - run: pnpm audit --prod --audit-level critical

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # PR에선 이미지 빌드만 검증(레지스트리 푸시·배포 없음). main push에서만 GHCR 푸시.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/kisagge/blog-project:latest
            ghcr.io/kisagge/blog-project:${{ github.sha }}
          # GHA 캐시(mode=max) export가 빌드(~1.5분)보다 훨씬 오래 걸려(~11분) 제거.
          # better-sqlite3는 prebuild(컴파일 X), next build도 빠르므로 콜드 빌드가
          # ~2분대로 충분. 캐시 유지 비용이 이득보다 커 순손해였음.

  deploy:
    needs: build-and-push
    # main에 push될 때, 또는 main에서 수동 실행(workflow_dispatch)할 때 배포.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            cd /srv/byjang
            echo "== disk before =="; df -h /; docker system df
            # pull 전에 미사용 이미지(과거 :latest 레이어 등) 정리 — 디스크 확보
            docker image prune -af
            echo "== pull =="; time docker compose pull
            echo "== up =="; time docker compose up -d
            echo "== disk after =="; df -h /
