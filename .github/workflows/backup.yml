name: DB Backup

# 매일 04:00 KST(19:00 UTC) + 수동 실행. 실행 중인 web 컨테이너에서 로컬 백업 스크립트 호출.
# 기존 배포와 동일한 SSH 시크릿 재사용(새 크레덴셜 없음). 백업은 $DEPLOY_DIR/data/backups에 적재.
# 오프사이트: 최신 DB 백업 + 업로드 이미지 묶음을 runner로 가져와 age 공개키(BACKUP_AGE_RECIPIENT)로 암호화한 뒤
# 워크플로 아티팩트(90일)로 보관 — 인스턴스 유실 대비. 저장소가 공개라 아티팩트는 누구나 받을 수 있으므로
# 반드시 암호화하며, CI엔 공개키만 있어 복호화 불가(개인키는 운영자만 보관). 복원: docs/deploy/lightsail.md.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

env:
  DEPLOY_DIR: /srv/byjang # 서버 앱 디렉터리(deploy·publish-scheduled 워크플로와 동일)

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 5m
          envs: DEPLOY_DIR
          script: |
            set -e
            cd "$DEPLOY_DIR"
            docker compose exec -T web sh scripts/backup-db.sh
            echo "== 최근 백업 =="; ls -lh data/backups | tail -5

      # ── 오프사이트 사본(암호화 아티팩트) ──
      - name: 공개키 설정 여부 확인
        id: offsite
        env:
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          if [ -z "$AGE_RECIPIENT" ]; then
            echo "::warning::BACKUP_AGE_RECIPIENT 미설정 — 오프사이트 사본을 건너뜀(서버 로컬 백업은 완료). docs/deploy/lightsail.md 참고."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 최신 백업 가져오기·검증·암호화
        if: steps.offsite.outputs.enabled == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          # 러너 이미지의 패키지 목록이 오래되면 install이 404로 실패 → 먼저 갱신.
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq age >/dev/null
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/backup_key && chmod 600 ~/.ssh/backup_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/backup_key -o BatchMode=yes $SSH_USER@$SSH_HOST"
          BACKUPS="$DEPLOY_DIR/data/backups"
          NAME=$($SSH "ls -t $BACKUPS/prod-*.db.gz | head -1 | xargs -n1 basename")
          case "$NAME" in prod-*.db.gz) ;; *) echo "::error::최신 백업 파일을 찾지 못함: $NAME"; exit 1 ;; esac
          $SSH "cat $BACKUPS/$NAME" > "$NAME"
          gzip -t "$NAME"  # 손상·잘림 검사(평문 단계에서만 가능)
          age -r "$AGE_RECIPIENT" -o "$NAME.age" "$NAME"
          # 업로드 이미지(DB엔 경로만 있음 — 인스턴스를 잃으면 본문·아바타 이미지가 사라진다).
          # 서버에서 tar로 묶어 스트리밍 → 목록 검사 → 같은 공개키로 암호화. 폴더가 없으면 빈 묶음.
          # 묶기가 실패해도(권한 등) DB 사본은 보관되도록 경고만 남긴다.
          UPLOADS="uploads-${NAME#prod-}"; UPLOADS="${UPLOADS%.db.gz}.tar.gz"
          if $SSH "cd $DEPLOY_DIR/data && if [ -d uploads ]; then tar -czf - uploads; else tar -czf - --files-from /dev/null; fi" > "$UPLOADS" \
            && tar -tzf "$UPLOADS" > uploads.list; then  # 목록이 읽혀야(손상·잘림 아님) 보관
            echo "업로드 파일 $(grep -vc '/$' uploads.list || true)개"
            age -r "$AGE_RECIPIENT" -o "$UPLOADS.age" "$UPLOADS"
            echo "UPLOADS=$UPLOADS" >> "$GITHUB_ENV"
          else
            echo "::warning::업로드 이미지 묶기 실패 — DB 사본만 보관"
          fi
          rm -f "$NAME" "$UPLOADS" uploads.list ~/.ssh/backup_key  # 평문·키는 runner에 남기지 않음
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          ls -l ./*.age

      - name: 암호화 사본을 아티팩트로 보관
        if: steps.offsite.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ env.NAME }}
          path: ${{ env.NAME }}.age
          retention-days: 90
          if-no-files-found: error

      - name: 업로드 이미지 묶음을 아티팩트로 보관
        if: steps.offsite.outputs.enabled == 'true' && env.UPLOADS != ''
        uses: actions/upload-artifact@v7
        with:
          name: uploads-backup-${{ env.UPLOADS }}
          path: ${{ env.UPLOADS }}.age
          retention-days: 90
          if-no-files-found: error
