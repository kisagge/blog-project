name: DB Backup

# 매일 04:00 KST(19:00 UTC) + 수동 실행. 실행 중인 web 컨테이너에서 로컬 백업 스크립트 호출.
# 기존 배포와 동일한 SSH 시크릿 재사용(새 크레덴셜 없음). 백업은 /srv/byjang/data/backups에 적재.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /srv/byjang
            docker compose exec -T web sh scripts/backup-db.sh
            echo "== 최근 백업 =="; ls -lh data/backups | tail -5
