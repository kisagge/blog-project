# 의존성 자동 업데이트(공급망·포맷 회귀 차단). 주간 + minor/patch 그룹화로 PR 노이즈 최소화.
# major는 호환성 리뷰를 위해 개별 PR로 분리된다.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
