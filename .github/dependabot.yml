# 의존성 자동 업데이트(공급망·포맷 회귀 차단). 주간 + minor/patch 그룹화로 PR 노이즈 최소화.
# major는 호환성 리뷰를 위해 개별 PR로 분리된다.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # @types/node 메이저는 node 런타임 LTS(현 24)에 맞춰 고정 — 비-LTS 메이저(25 등)
    # 자동 제안 방지. node 베이스이미지 승격과 함께 수동으로 올린다.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # node 베이스이미지는 LTS 라인(현 24.x)만 자동 추적 — 비-LTS Current(25/26 등)
    # 메이저 점프는 무시하고, 차기 LTS로의 승격은 수동으로 처리(안정성 우선).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
