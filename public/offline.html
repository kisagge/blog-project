<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>오프라인 · BY Playground</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #18181b;
        --muted: #52525b;
        --border: rgba(0, 0, 0, 0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #f4f4f5;
          --muted: #a1a1aa;
          --border: rgba(255, 255, 255, 0.2);
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Apple SD Gothic Neo",
          "Noto Sans KR",
          sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-block;
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 9999px;
        padding: 0.5rem 1.25rem;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷에 연결되어 있지 않아요</h1>
      <p>
        네트워크 연결을 확인한 뒤 다시 시도해 주세요. 개인정보 보호를 위해
        이전에 본 화면은 기기에 저장하지 않습니다.
      </p>
      <a href="/">다시 시도</a>
    </main>
  </body>
</html>
